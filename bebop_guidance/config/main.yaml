/**:
  ros__parameters:
    controller_type: "rise" # "proportional" or "rise"
    control_freq_hz: 50.0 # Control loop frequency in Hz
    max_vertical_speed: 1.0 # m/s (range: 0.5 to 2.5)
    max_tilt_angle: 30.0 # deg (range: 5.0 to 30.0)
    max_rotation_speed: 200.0 # deg/s (range: 10.0 to 200.0)
    visualizer_buffer_size: 250
    
/**/bebop_guidance:
  ros__parameters:
    target_initial_pos: [1.5, 1.375, 0.0]
    control_gains:
      vel_max_mps: 1.0
      k1: 0.5
      k2: 1.2
      beta: 0.015
      k1_y: 0.8
      k2_y: 1.2
      beta_y: 0.05
      kp_yaw: 1.0
      kp_vert: 1.0 # P controller only
      kp_lat: 1.3 # P controller only

/**/bebop_control:
  ros__parameters:
    log_throttle_duration_ms: 1000
    stale_command_timeout_sec: 0.2
    stale_odom_timeout_sec: 0.1
    control_gains:
      kp_tilt_effort: 0.3
      ki_tilt_effort: 0.01

/**/rho_filter:
  ros__parameters:
    rho_filter_gains:
      k1: 10.0
      k2: 10.0
      k3: 6.0
      k4: 0.5

/**/bebop_teleop:
  ros__parameters:
    x_axis: 4
    y_axis: 3
    z_axis: 1
    yaw_axis: 0
    takeoff_button: 9
    land_button: 8
    mode_button: 0
    x_vel_max: 1.0
    y_vel_max: 1.0
    z_vel_max: 1.0
    yaw_vel_max: 1.0

/**/joy:
  ros__parameters:
    deadzone: 0.25
    autorepeat_rate: 20.0
    coalesce_interval_ms: 50

/**/vrpn_mocap_client:
  ros__parameters:
    server: "192.168.1.201"
    port: 3883
    frame_id: 'world'

/**/bebop_driver:
  ros__parameters:
    camera_calibration_file: "package://ros2_bebop_driver/config/bebop2_camera_calib.yaml"

/**/indoor_lab_viz:
  ros__parameters:
    border_x: [-2.7432, 2.7432, 2.7432, -2.7432]
    border_z: [-7.3152, -7.3152, 6.096, 6.096]
